<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      padding: 20px;
      background: #fafafa;
      color: #333;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #1A73E8;
    }
    .header h2 {
      margin: 0;
      color: #1A73E8;
      font-size: 18px;
    }
    .info-paciente {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    .info-paciente strong {
      color: #1A73E8;
    }
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }
    button {
      padding: 14px 24px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      width: 100%;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .btn-primary {
      background: #1A73E8;
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      background: #1557B0;
    }
    .btn-success {
      background: #34A853;
      color: white;
    }
    .btn-success:hover:not(:disabled) {
      background: #2D9248;
    }
    .btn-secondary {
      background: #5F6368;
      color: white;
    }
    .btn-secondary:hover {
      background: #4A4D50;
    }
    .resultado-container {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
      max-height: 350px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .resultado-container.show {
      display: block;
    }
    .status-mensaje {
      padding: 12px;
      margin-top: 12px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
      text-align: center;
      font-weight: 600;
    }
    .status-mensaje.success {
      background: #D1F2EB;
      color: #0E6655;
      border: 1px solid #A6E9D5;
      display: block;
    }
    .status-mensaje.error {
      background: #F8D7DA;
      color: #721C24;
      border: 1px solid #F5C6CB;
      display: block;
    }
    .link-formulario {
      background: #E8F0FE;
      padding: 12px;
      border-radius: 4px;
      margin-top: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #1A73E8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>📝 Formulario Asistencia Técnica</h2>
  </div>

  <div class="info-paciente">
    <strong>Paciente:</strong> <?= paciente ?><br>
    <strong>ID Proyecto:</strong> <?= idProyecto ?><br>
    <strong>Fecha:</strong> <?= fecha ?><br>
    <strong>Institución:</strong> <?= institucion ?>
  </div>
  
  <div id="buttonContainer" class="button-container">
    <div style="text-align: center; color: #5F6368;">
      <p>⏳ Cargando...</p>
    </div>
  </div>
  
  <div id="statusMensaje" class="status-mensaje"></div>
  <div id="resultadoContainer" class="resultado-container"></div>

  <script>
    const fila = <?= fila ?>;
    const nombreHoja = "<?= nombreHoja ?>";
    let infoExistente = null;
    
    // Al cargar, verificar si existe en Links_AsistenciaTecnica
    window.onload = function() {
      console.log('Verificando existencia - Fila:', fila, 'Hoja:', nombreHoja);
      
      // Pequeño timeout para asegurar que Apps Script esté listo
      setTimeout(function() {
        verificarExistencia();
      }, 100);
    };
    
    /**
     * Verifica si ya existe en Links_AsistenciaTecnica
     */
    function verificarExistencia() {
      console.log('Llamando a consultarInfoFormulario...');
      
      // Verificar que google.script.run existe
      if (typeof google === 'undefined' || typeof google.script === 'undefined') {
        console.error('Google Apps Script no está disponible');
        document.getElementById('buttonContainer').innerHTML = 
          '<p style="color: #EA4335;">✗ Error: Apps Script no está disponible</p>' +
          '<button class="btn-secondary" onclick="cerrarDialogo()">❌ Cerrar</button>';
        return;
      }
      
      google.script.run
        .withSuccessHandler(function(resultado) {
          console.log('Resultado recibido:', resultado);
          
          if (!resultado) {
            console.error('Resultado vacío recibido');
            mostrarBotonGenerar(); // Por defecto mostrar generar
            return;
          }
          
          if (resultado.encontrado) {
            infoExistente = resultado.info;
            mostrarBotonesExistente();
          } else {
            mostrarBotonGenerar();
          }
        })
        .withFailureHandler(function(error) {
          console.error('Error en consultarInfoFormulario:', error);
          
          document.getElementById('buttonContainer').innerHTML = 
            '<p style="color: #EA4335;">✗ Error al verificar: ' + (error.message || error) + '</p>' +
            '<button class="btn-secondary" onclick="cerrarDialogo()">❌ Cerrar</button>';
        })
        .consultarInfoFormulario(fila, nombreHoja);
    }
    
    /**
     * Muestra botones cuando ya existe el formulario
     */
    function mostrarBotonesExistente() {
      document.getElementById('buttonContainer').innerHTML = 
        '<button class="btn-success" onclick="verLink()">🔗 Ver Link</button>' +
        '<button class="btn-primary" onclick="verResumenConLink()">📋 Ver Resumen CX + Link</button>' +
        '<button class="btn-secondary" onclick="cerrarDialogo()">❌ Salir</button>';
    }
    
    /**
     * Muestra botón para generar formulario
     */
    function mostrarBotonGenerar() {
      document.getElementById('buttonContainer').innerHTML = 
        '<button id="btnGenerar" class="btn-primary" onclick="generarFormulario()">📋 Generar Formulario</button>' +
        '<button class="btn-secondary" onclick="cerrarDialogo()">❌ Salir</button>';
    }
    
    /**
     * Ver solo el link
     */
    function verLink() {
      const statusDiv = document.getElementById('statusMensaje');
      const resultadoDiv = document.getElementById('resultadoContainer');
      
      const link = infoExistente.linkForm;
      
      // Copiar al portapapeles
      copiarTexto(link);
      
      // Mostrar mensaje de éxito
      statusDiv.className = 'status-mensaje success';
      statusDiv.textContent = '✓ Link copiado al portapapeles';
      
      // Mostrar el link
      resultadoDiv.innerHTML = '<div class="link-formulario">' + link + '</div>';
      resultadoDiv.className = 'resultado-container show';
    }
    
    /**
     * Ver resumen CX + link
     */
    function verResumenConLink() {
      const statusDiv = document.getElementById('statusMensaje');
      const resultadoDiv = document.getElementById('resultadoContainer');
      
      // Construir resumen
      google.script.run
        .withSuccessHandler(function(resumen) {
          const textoCompleto = resumen + '\n\n📄 Informe Técnico de la Cirugía:\n' + infoExistente.linkForm;
          
          // Copiar al portapapeles
          copiarTexto(textoCompleto);
          
          // Mostrar mensaje de éxito
          statusDiv.className = 'status-mensaje success';
          statusDiv.textContent = '✓ Resumen + Link copiado al portapapeles';
          
          // Mostrar en pantalla
          resultadoDiv.textContent = textoCompleto;
          resultadoDiv.className = 'resultado-container show';
        })
        .withFailureHandler(function(error) {
          statusDiv.className = 'status-mensaje error';
          statusDiv.textContent = '✗ Error: ' + error.message;
        })
        .obtenerResumenCx(fila, nombreHoja);
    }
    
    /**
     * Genera el formulario
     */
    function generarFormulario() {
      console.log('Iniciando generación de formulario...');
      
      const btn = document.getElementById('btnGenerar');
      const statusDiv = document.getElementById('statusMensaje');
      const resultadoDiv = document.getElementById('resultadoContainer');
      
      btn.disabled = true;
      btn.textContent = '⏳ Generando formulario...';
      statusDiv.className = 'status-mensaje';
      statusDiv.style.display = 'none';
      resultadoDiv.className = 'resultado-container';
      
      console.log('Llamando a procesarGenerarFormulario...');
      
      google.script.run
        .withSuccessHandler(function(resultado) {
          console.log('Resultado generación:', resultado);
          
          if (resultado.success) {
            btn.textContent = '✓ Formulario generado';
            statusDiv.className = 'status-mensaje success';
            statusDiv.textContent = '✓ ' + resultado.mensaje;
            
            // Mostrar el link
            resultadoDiv.innerHTML = '<div class="link-formulario">' + resultado.linkForm + '</div>';
            resultadoDiv.className = 'resultado-container show';
            
            // Copiar al portapapeles
            copiarTexto(resultado.linkForm);
          } else {
            btn.disabled = false;
            btn.textContent = '📋 Generar Formulario';
            statusDiv.className = 'status-mensaje error';
            statusDiv.textContent = '✗ ' + resultado.mensaje;
          }
        })
        .withFailureHandler(function(error) {
          console.error('Error en generación:', error);
          
          btn.disabled = false;
          btn.textContent = '📋 Generar Formulario';
          statusDiv.className = 'status-mensaje error';
          statusDiv.textContent = '✗ Error: ' + error.message;
        })
        .procesarGenerarFormulario(fila, nombreHoja);
    }
    
    /**
     * Copia texto al portapapeles
     */
    function copiarTexto(texto) {
      const textarea = document.createElement('textarea');
      textarea.value = texto;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
      } catch (error) {
        console.error('Error al copiar:', error);
      } finally {
        document.body.removeChild(textarea);
      }
    }
    
    /**
     * Cierra el diálogo
     */
    function cerrarDialogo() {
      google.script.host.close();
    }
  </script>
</body>
</html>
